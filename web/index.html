<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PLATEAU MVT Research</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #091114; color: #e5efec; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(720px, calc(100% - 40px)); }
    h1 { margin-bottom: 8px; }
    p { color: #9fb2ad; line-height: 1.6; }
    .viewers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 28px; }
    a { padding: 22px; border: 1px solid #294039; border-radius: 14px; background: #0f1c20; color: inherit; text-decoration: none; }
    a:hover { border-color: #47e6b1; }
    strong { display: block; margin-bottom: 8px; font-size: 1.1rem; color: #47e6b1; }
    span { color: #9fb2ad; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>PLATEAU MVT Research</h1>
    <p>表示方法を選択してください。両Viewerは同じ静的索引とMVT取得規則を使用します。</p>
    <div class="viewers">
      <a href="/viewers/maplibre/"><strong>2D MapLibre Viewer</strong><span>タイル・自治体境界・属性を2D地図で確認</span></a>
      <a href="/viewers/three/"><strong>3D Three.js Viewer</strong><span>地形とPLATEAU MVTを3Dで確認</span></a>
      <a href="/viewers/even-g2/"><strong>Even G2（プレビュー）</strong><span>3D静止画の書き出し・実機統合の入口</span></a>
    </div>
  </main>
</body>
</html>
