<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Even G2 — PLATEAU MVT</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a1210; color: #e8f0ec; }
    body { margin: 0; padding: 20px; line-height: 1.55; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .lead { color: #9fb2ad; margin: 0 0 20px; max-width: 52rem; }
    a { color: #47e6b1; }
    .grid { display: grid; gap: 16px; max-width: 52rem; }
    section { border: 1px solid #294039; border-radius: 12px; padding: 16px; background: #0f1c18; }
    h2 { font-size: 1rem; margin: 0 0 8px; color: #a7f3d0; }
    ol { margin: 0; padding-left: 1.2rem; color: #c5d6d0; }
    #log { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; color: #b8c9c3; min-height: 4em; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .btn {
      display: inline-block; padding: 10px 14px; border-radius: 8px; border: 1px solid #3d5c50;
      background: #142820; color: inherit; text-decoration: none; font-size: 14px;
    }
    .btn:hover { border-color: #47e6b1; }
    #preview { max-width: 100%; border: 1px solid #294039; border-radius: 8px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Even G2（開発プレビュー）</h1>
  <p class="lead">
    検証 1（静止画）→ 2（実機送信）の順で進めます。いまはブラウザ上で
    <a href="/viewers/three/">3D Viewer</a> の画面を G2 向け解像度に落として書き出せます。
  </p>

  <div class="grid">
    <section>
      <h2>検証 1 — 3D 静止画</h2>
      <ol>
        <li>3D Viewer で京都駅周辺の地形・土地利用を表示</li>
        <li>「G2 向けプレビュー保存」で PNG（最大幅 640px）を取得</li>
        <li>下のプレビュー欄に同じ画像を読み込んで確認（任意）</li>
      </ol>
      <div class="actions">
        <a class="btn" href="/viewers/three/">3D Viewer を開く</a>
        <button type="button" class="btn" id="sample-preview">同梱サンプルを表示</button>
        <label class="btn" style="cursor:pointer">
          保存済み PNG をプレビュー
          <input id="file-input" type="file" accept="image/png,image/jpeg" hidden />
        </label>
      </div>
      <img id="preview" src="/data/output/previews/sample-preview.png" alt="G2 プレビュー" />
    </section>

    <section>
      <h2>ログ（プレースホルダ）</h2>
      <div id="log">GPS / 方位 / SDK 接続は Even Hub 統合時にここへ出力します。</div>
    </section>
  </div>

  <script type="module">
    const log = document.getElementById('log');
    const preview = document.getElementById('preview');
    const input = document.getElementById('file-input');
    const sampleUrl = '/data/output/previews/sample-preview.png';

    function showPreview(src, label) {
      preview.src = src;
      log.textContent = label;
    }

    preview.addEventListener('load', () => {
      if (!log.textContent) {
        log.textContent = '同梱サンプル（640×320）を表示中。3D Viewer の PNG に差し替え可能です。';
      }
    });
    preview.addEventListener('error', () => {
      log.textContent = 'サンプル画像がありません。npm run generate:g2-preview を実行してください。';
      preview.removeAttribute('src');
    });

    document.getElementById('sample-preview')?.addEventListener('click', () => {
      showPreview(sampleUrl, '同梱サンプル（640×320）を表示中。');
    });

    input?.addEventListener('change', () => {
      const file = input.files?.[0];
      if (!file) return;
      showPreview(URL.createObjectURL(file), `プレビュー読込: ${file.name} (${Math.round(file.size / 1024)} KB)`);
    });
  </script>
</body>
</html>
